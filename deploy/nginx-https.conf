# =============================================================================
# Nginx config — Fashion POS (VPN-only, HTTPS)
# =============================================================================
# Generated by enable-https.sh — replaces nginx.conf when HTTPS is enabled.
# Certificate: /etc/nginx/ssl/fashion-pos/cert.pem (self-signed, 10 years)
# =============================================================================

limit_req_zone $binary_remote_addr zone=pos_limit:10m rate=30r/s;

upstream odoo {
    server 127.0.0.1:8069;
    keepalive 32;
}

upstream odoo_longpolling {
    server 127.0.0.1:8072;
}

# ── Redirect HTTP → HTTPS on VPN ─────────────────────────────────────────────
server {
    listen 10.0.0.1:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS server (VPN-only) ───────────────────────────────────────────────────
server {
    listen 10.0.0.1:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fashion-pos/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/fashion-pos/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 64m;
    proxy_read_timeout   720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout   720s;

    add_header X-Frame-Options          "SAMEORIGIN"   always;
    add_header X-Content-Type-Options   "nosniff"      always;
    add_header Referrer-Policy          "strict-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied    any;

    location ~* /web/static/ {
        proxy_pass http://odoo;
        proxy_cache_valid 200 7d;
        proxy_buffering on;
        add_header Cache-Control "public, max-age=604800";
        proxy_set_header Host $host;
    }

    location /longpolling/ {
        proxy_pass http://odoo_longpolling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=pos_limit burst=50 nodelay;
        proxy_pass http://odoo;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header Connection         "";
        proxy_buffering off;
    }

    location ~ ^/web/database/ {
        deny all;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ── Block all public internet traffic ────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 default_server ssl;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/fashion-pos/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/fashion-pos/key.pem;
    return 444;
}
