[options]
; ── Database ───────────────────────────────────────────────────────────────
; These are overridden by docker-compose environment variables.
; db_host, db_port, db_user, db_password are passed via CLI flags.
db_name      = fashion_gambia

; ── Workers (concurrent users) ─────────────────────────────────────────────
; Rule of thumb: workers = (CPU cores × 2) + 1
; For a 2-vCPU VPS set workers = 4. Increase to 6 on 4-vCPU.
workers      = 4

; Longpolling worker for real-time POS sync (barcode, session updates)
gevent_port = 8072

; ── Performance ────────────────────────────────────────────────────────────
limit_time_cpu    = 600
limit_time_real   = 1200
; 2.5 GB hard limit, 2 GB soft limit
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

; ── Security ───────────────────────────────────────────────────────────────
; Nginx handles SSL, so Odoo trusts X-Forwarded-For headers
proxy_mode   = True

; Hide the database selector on the login page
list_db      = False

; ── Logging ────────────────────────────────────────────────────────────────
; In Docker, log to stdout so docker logs captures output correctly
; logfile is intentionally NOT set here
log_level    = warn

; ── Addons ─────────────────────────────────────────────────────────────────
addons_path  = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
