# =============================================================================
# Nginx config — Fashion POS (VPN-only access)
# =============================================================================
# Odoo is ONLY accessible from the WireGuard VPN subnet (10.0.0.0/24).
# Public internet requests are silently dropped.
# =============================================================================

# ── Rate limiting (protect against abuse even on VPN) ─────────────────────────
limit_req_zone $binary_remote_addr zone=pos_limit:10m rate=30r/s;

# ── Upstream: Odoo app server ─────────────────────────────────────────────────
upstream odoo {
    server 10.0.0.1:8069;
    keepalive 32;
}

# ── Upstream: Longpolling (real-time POS barcode/session sync) ────────────────
upstream odoo_longpolling {
    server 10.0.0.1:8072;
}

# ── HTTP server (VPN-only) ────────────────────────────────────────────────────
server {
    # Listen ONLY on the WireGuard VPN interface — not on public IP
    listen 10.0.0.1:80;
    server_name _;

    client_max_body_size 64m;
    proxy_read_timeout   720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout   720s;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"   always;
    add_header X-Content-Type-Options   "nosniff"      always;
    add_header Referrer-Policy          "strict-origin" always;

    # ── Gzip compression (faster POS load on slow Gambia connection) ────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied    any;

    # ── Static files: serve directly from Odoo container ──────────────────
    location ~* /web/static/ {
        proxy_pass http://odoo;
        proxy_cache_valid 200 7d;
        proxy_buffering on;
        add_header Cache-Control "public, max-age=604800";
        proxy_set_header Host $host;
    }

    # ── Longpolling endpoint ──────────────────────────────────────────────
    location /longpolling/ {
        proxy_pass http://odoo_longpolling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── All other requests → Odoo ──────────────────────────────────────────
    location / {
        limit_req zone=pos_limit burst=50 nodelay;

        proxy_pass http://odoo;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Connection         "";
        proxy_buffering off;
    }

    # ── Block anything from outside the VPN ────────────────────────────────
    # (Belt-and-suspenders: Nginx only listens on 10.0.0.1 anyway)
    location ~ ^/web/database/ {
        # Block database manager from all clients
        deny all;
    }

    # ── Healthcheck endpoint (used by monitoring) ───────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ── Block all public internet traffic ────────────────────────────────────────
# Nginx does NOT listen on 0.0.0.0:80 — only on the VPN IP.
# This server block catches any misconfigured requests on the public IP.
server {
    listen 80 default_server;
    server_name _;
    return 444;  # Drop connection silently
}
